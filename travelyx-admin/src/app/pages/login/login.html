<div class="login-container">
  <div class="gradient-sphere sphere-1"></div>
  <div class="gradient-sphere sphere-2"></div>

  <div class="login-wrapper">

    <!-- ── Panel Login ── -->
    <div class="glass-panel login-card" *ngIf="!mustChangePassword">
      <div class="login-header">
        <div class="logo">
          <span class="logo-icon">✨</span>
          <h2>Travelyx</h2>
        </div>
        <p class="subtitle">Ingresa tus credenciales para acceder al panel</p>
      </div>

      <form class="login-form" (ngSubmit)="onLogin()">

        <div *ngIf="errorMessage && !isLocked" class="error-msg">{{ errorMessage }}</div>

        <div *ngIf="isLocked" class="error-msg locked-msg" style="background: #ffebee; border-left: 4px solid #f44336; color: #b71c1c; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
          <span style="font-size: 1.5rem; display: block; margin-bottom: 5px;">🔒</span>
          <strong>Cuenta bloqueada por seguridad</strong><br>
          <span style="font-size: 0.9rem;">Múltiples intentos fallidos.</span><br>
          <span style="display: inline-block; margin-top: 8px; background: #f44336; color: white; padding: 4px 12px; border-radius: 12px; font-weight: bold; letter-spacing: 1px;">
            {{ countdownText }}
          </span>
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <div class="input-wrapper">
            <input type="email" id="email" name="email" [(ngModel)]="email"
                   placeholder="correo@ejemplo.com" autofocus required [disabled]="isLocked">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" [(ngModel)]="password"
                   placeholder="••••••••" required [disabled]="isLocked">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-pill btn-block" [disabled]="isLoading || isLocked">
          {{ isLoading ? 'Verificando...' : 'Iniciar Sesión' }}
        </button>
      </form>
    </div>

    <!-- ── Panel Cambio de Contraseña (primer acceso) ── -->
    <div class="glass-panel login-card" *ngIf="mustChangePassword">
      <div class="login-header">
        <div class="logo">
          <span class="logo-icon">🔑</span>
          <h2>Establece tu Contraseña</h2>
        </div>
        <p class="subtitle">Es tu primer acceso. Por seguridad, crea una contraseña nueva.</p>
      </div>

      <form class="login-form" (ngSubmit)="onChangePassword()">

        <div *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</div>

        <div class="form-group">
          <label>Nueva Contraseña</label>
          <div class="input-wrapper">
            <input type="password" [(ngModel)]="newPassword" name="newPwd"
                   placeholder="Mínimo 6 caracteres" required>
          </div>
        </div>

        <div class="form-group">
          <label>Confirmar Nueva Contraseña</label>
          <div class="input-wrapper">
            <input type="password" [(ngModel)]="confirmPassword" name="confirmPwd"
                   placeholder="Repite tu nueva contraseña" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-pill btn-block" [disabled]="isLoading">
          {{ isLoading ? 'Guardando...' : 'Establecer y Entrar' }}
        </button>
      </form>
    </div>

  </div>
</div>
